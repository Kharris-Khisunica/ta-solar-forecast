# Urutan kepentingan kelompok fitur A PRIORI (T20, keputusan #6)
# WAJIB di-commit SEBELUM notebook 08 (XAI) dijalankan pertama kali. Jangan diubah setelah melihat hasil XAI.
# Berlaku untuk konfigurasi utama: target k_c (geometri sudah dinormalisasi lewat clear-sky).
# Urutan 1 = paling penting.

tanggal_ditetapkan: "2026-11-27"
target: kc

kelompok:
  - nama: nwp_radiasi
    urutan: 1
    fitur: [gfs_kc_nwp, gfs_kc_nwp_3x3, gfs_ghi_nwp, gfs_ghi_nwp_3x3]
    alasan: "Ramalan langsung besaran target dari model fisis (GFS), sudah memuat efek awan."
  - nama: nwp_awan
    urutan: 2
    fitur: [gfs_tcdc_atm, gfs_tcdc_low, gfs_tcdc_mid, gfs_tcdc_high, gfs_tcdc_atm_3x3]
    alasan: "Awan adalah pengubah utama k_c; geometri sudah dikeluarkan lewat normalisasi clear-sky."
  - nama: klimatologi
    urutan: 3
    fitur: [kc_clim]
    alasan: "Merangkum pola awan konvektif harian & musiman (k_c 0,83 pagi -> 0,55 sore)."
  - nama: lag_observasi
    urutan: 4
    fitur: [kc_same_hour_lag, same_hour_from_d2, kc_mean_d1_to_issue, kc_mean_d1_morning, kc_mean_d2, kc_at_issue]
    alasan: "Persistensi kondisi atmosfer; melemah pada horizon 12-36 jam."
  - nama: geometri_waktu
    urutan: 5
    fitur: [cos_zenith, hour_sin, hour_cos, doy_sin, doy_cos, ghi_cs, ghi_extra]
    alasan: "Untuk target k_c, efek geometri sebagian besar sudah ternormalisasi."
  - nama: termodinamika
    urutan: 6
    fitur: [gfs_rh_2m, gfs_pwat_atm1, gfs_cape_sfc, gfs_tmp_2m, temperature_at_issue, relative_humidity_at_issue, dew_point_at_issue]
    alasan: "Prekursor konveksi; pengaruh tidak langsung terhadap radiasi."
  - nama: aerosol
    urutan: 7
    fitur: [aerosol_optical_depth_at_issue]
    alasan: "Efek kecil dibanding awan di iklim tropis basah."
